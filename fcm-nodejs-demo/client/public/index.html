<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCM Web Client Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
    p.desc { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 12px; color: #e2e8f0; }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .input-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label { font-size: 13px; font-weight: 500; color: var(--muted); }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: #0b1120;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }
    textarea { height: 90px; resize: vertical; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: #334155;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .log-box {
      background: #020617;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🚀 FCM Web Client Demo</h1>
      <p class="desc">Aplikasi web sederhana untuk request permission, menerima FCM Token, dan mendengarkan push notification.</p>

      <div id="permissionStatus" class="status-badge">Status Izin: Belum Diminta</div>

      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="btnRequestPermission" class="btn">1. Minta Izin & Ambil FCM Token</button>
        <button id="btnRegisterToServer" class="btn" style="background: var(--success);" disabled>2. Kirim Token ke Server</button>
      </div>

      <div class="input-group">
        <label for="userIdInput">User ID (untuk simulasi server):</label>
        <input type="text" id="userIdInput" value="user_123" />
      </div>

      <div class="input-group">
        <label for="fcmTokenInput">FCM Registration Token Anda:</label>
        <textarea id="fcmTokenInput" readonly placeholder="Token akan muncul di sini setelah izin diberikan..."></textarea>
      </div>
    </div>

    <div class="card">
      <h2>📬 Log Notifikasi (Foreground & Status)</h2>
      <div id="logArea" class="log-box">[System] Menunggu interaksi pengguna...</div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
